{{ define "main" }}
<div class="blog-header">
    {{ with index .Params.categories 0 }}<span class="blog-tag blog-tag--{{ . | urlize }}">{{ . }}</span>{{ end }}
    <span class="blog-date">{{ .Date.Format "Jan. 2, 2006" }}</span>
</div>
<h2>{{ .Title }}</h2>

{{ .Content }}

{{ with .GetTerms "tags" }}
<div class="post-tags">
    {{ range . }}<a class="paper-link" href="{{ .RelPermalink }}">{{ .LinkTitle | lower }}</a>{{ end }}
</div>
{{ end }}
{{ end }}
