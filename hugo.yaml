baseURL: https://josiehong.github.io/blog/
languageCode: en-us
title: "Josie's Log"

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true

params:
  description: "Yuhui (Josie) Hong's blog — study notes, projects, and wild thoughts."
  author: Yuhui Hong

taxonomies:
  tag: tags

outputs:
  home:
    - HTML
    - RSS
    - JSON # search index

markup:
  goldmark:
    renderer:
      unsafe: true # allow raw HTML in migrated Markdown posts
  highlight:
    noClasses: false
